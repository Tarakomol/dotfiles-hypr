[gradient]
color_stops = {{colors.primary.default.hex}},{{colors.secondary.default.hex}},{{colors.tertiary.default.hex}}
color_count = 3
curve = 0.5
color_type = 4

[equalizer]
number_of_bands = 7

[system]
method = alsa
alsa_device = "default"

[music]
input_type = file
input = /dev/stdin

[output]
channels = stereo
mono -stereo = false
render_method = opengl
background_color = 000000
foreground_color = {{colors.primary.default.hex}}

[gradients]
color_stops = {{colors.primary.default.hex}},{{colors.secondary.default.hex}},{{colors.tertiary.default.hex}}
color_count = 3
curve = 0.5
color_type = 4
