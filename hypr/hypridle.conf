general {
    before_sleep_cmd = pidof hyprlock || hyprlock

    # Уважаем блокировки простоя от приложений и системы:
    # видео в браузере, полноэкранные игры, геймпад и т.п.
    ignore_dbus_inhibit = 0
    ignore_systemd_inhibit = 0
    ignore_wayland_inhibit = 0
}

listener {
    timeout = 900                       # 15 минут простоя, hyprlock
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/idle-suspend.sh
    on-resume = pkill -f idle-suspend.sh
}
