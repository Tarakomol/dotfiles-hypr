source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    noise = 0.02
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $primary
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $on_surface
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face
    size = 110
    rounding = -1
    border_size = 3
    border_color = $secondary
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = 28
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $secondary
    inner_color = $surface
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">  $USER</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -100
    halign = center
    valign = center
}
